name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      # PostgreSQL desechable para las pruebas SQL, de API y E2E (versión de Supabase).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @captia/web exec playwright install --with-deps chromium
      - run: pnpm run validate

  supabase-migrations:
    # Aplica las migraciones sobre un Supabase local real (Auth, roles y extensiones reales).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start --exclude studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor,realtime,storage-api
      - run: supabase db reset
      - name: Comprobar el esquema core
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -c "select count(*) from core.permissions" \
            -c "select key, status from core.service_catalog order by key"
      - run: supabase stop
