<!doctype html>
<html lang="es">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: consola de operaciones — barra lateral fija oscura + área de trabajo; cada módulo es una vista (#hash). */
:root {
  --ink: #071318;          /* barra lateral */
  --ink-2: #0c1e26;
  --ink-3: #13303b;
  --side-fg: #b8cdd4;
  --bg: #f3f7f8;
  --surface: #ffffff;
  --line: #dbe5e8;
  --fg: #0f1f25;
  --muted: #5b6f76;
  --brand: #0e7490;
  --brand-strong: #155e75;
  --brand-soft: #e0f4f8;
  --ok: #047857; --ok-bg: #d8f3e8;
  --warn: #a16207; --warn-bg: #fdf0cc;
  --bad: #b42318; --bad-bg: #fde3e0;
  --idle: #4b5d64; --idle-bg: #e6edef;
  --info: #5b3fc4; --info-bg: #ebe5fc;
  --demo: #92400e; --demo-bg: #fff3d6; --demo-line: #f3cf7a;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #081419; --surface: #0e2029; --line: #1c3743; --fg: #e3eef1; --muted: #8fa6ad;
    --brand: #22b8d6; --brand-strong: #67d4ea; --brand-soft: #0f2f3a;
    --ok: #4ade9b; --ok-bg: #0f3326; --warn: #f5c451; --warn-bg: #3a2c0b; --bad: #ff8a7a; --bad-bg: #3d1611;
    --idle: #a9bcc2; --idle-bg: #1a3039; --info: #b7a6ff; --info-bg: #261e48;
    --demo: #fcd58a; --demo-bg: #2f2409; --demo-line: #6b5216;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #081419; --surface: #0e2029; --line: #1c3743; --fg: #e3eef1; --muted: #8fa6ad;
  --brand: #22b8d6; --brand-strong: #67d4ea; --brand-soft: #0f2f3a;
  --ok: #4ade9b; --ok-bg: #0f3326; --warn: #f5c451; --warn-bg: #3a2c0b; --bad: #ff8a7a; --bad-bg: #3d1611;
  --idle: #a9bcc2; --idle-bg: #1a3039; --info: #b7a6ff; --info-bg: #261e48;
  --demo: #fcd58a; --demo-bg: #2f2409; --demo-line: #6b5216;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.app { display: flex; min-height: 100%; }
aside { width: 248px; flex-shrink: 0; background: var(--ink); color: var(--side-fg); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 18px 12px 24px max(12px, env(safe-area-inset-left, 0px)); }
.logo { font-family: var(--font-display); font-weight: 700; font-size: 19px; color: #fff; padding: 2px 10px 16px; letter-spacing: -0.01em; }
.logo span { color: #22b8d6; }
.nav-group { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em; color: #5f7d87; padding: 14px 10px 6px; }
nav a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; color: var(--side-fg); text-decoration: none; font-size: 13.5px; }
nav a:hover { background: var(--ink-3); color: #fff; }
nav a.active { background: #0e7490; color: #fff; }
nav a .count { font-family: var(--font-mono); font-size: 11px; opacity: 0.75; }
main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.demo-banner { background: var(--demo-bg); color: var(--demo); border-bottom: 1px solid var(--demo-line); font-size: 13px; padding-block: 8px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.demo-banner strong { font-weight: 600; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--bg); }
.content { padding-block: 28px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); max-width: 1320px; width: 100%; }
h1 { font-family: var(--font-display); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 0 0 12px; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 72ch; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 26px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.kpi .label { color: var(--muted); font-size: 12.5px; }
.kpi .value { font-family: var(--font-display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
.kpi .note { font-size: 12px; color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
td.num, .mono { font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ok { color: var(--ok); background: var(--ok-bg); }
.warn { color: var(--warn); background: var(--warn-bg); }
.bad { color: var(--bad); background: var(--bad-bg); }
.idle { color: var(--idle); background: var(--idle-bg); }
.info { color: var(--info); background: var(--info-bg); }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.dev-meta .pill { justify-self: start; }
.stats b { white-space: nowrap; }
.dev { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.dev-top { display: flex; gap: 12px; }
.screen { width: 58px; height: 104px; border-radius: 10px; border: 3px solid #1b2b31; background: linear-gradient(160deg, #0e7490, #13303b 70%); flex-shrink: 0; position: relative; overflow: hidden; }
.screen.off { background: #10181b; }
.screen.err { background: linear-gradient(160deg, #7a271a, #1b0d0a); }
.screen.boot { background: #0b1418; }
.screen.boot::after { content: "android"; position: absolute; inset: 0; display: grid; place-items: center; color: #9fe6b6; font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.08em; }
.screen .apps { position: absolute; inset: 14px 7px auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.screen .apps i { aspect-ratio: 1; border-radius: 4px; background: rgba(255,255,255,0.28); }
.dev-name { font-weight: 600; }
.dev-meta { font-size: 12.5px; color: var(--muted); display: grid; gap: 2px; min-width: 0; }
.bar { height: 6px; border-radius: 3px; background: var(--idle-bg); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--brand); border-radius: 3px; }
.bar.hot > span { background: var(--warn); }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; font-size: 11.5px; color: var(--muted); }
.stats b { display: block; color: var(--fg); font-family: var(--font-mono); font-weight: 500; font-size: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
button, .btn { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--brand); color: var(--brand); }
button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
button.primary:hover { background: var(--brand-strong); color: #fff; }
button:focus-visible, nav a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
.section { margin-top: 26px; }
.notice { border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; color: var(--muted); font-size: 13px; background: var(--surface); margin-top: 16px; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-family: var(--font-mono); font-size: 11.5px; background: var(--brand-soft); color: var(--brand-strong); border-radius: 6px; padding: 2px 7px; }
.toast { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 13px; max-width: 340px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
.menu-btn { display: none; }
@media (max-width: 900px) {
  .two { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .app { flex-direction: column; }
  aside { position: static; width: 100%; height: auto; padding: 12px max(16px, env(safe-area-inset-left, 0px)); }
  aside nav { display: none; }
  aside.open nav { display: block; }
  .menu-btn { display: inline-block; background: var(--ink-3); color: #fff; border-color: var(--ink-3); }
  .logo-row { display: flex; justify-content: space-between; align-items: center; }
  .logo { padding: 0; }
  .topbar, .demo-banner, .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: no-preference) { nav a, button { transition: background .15s, color .15s, border-color .15s; } }

/* Granja de teléfonos: escenario oscuro fijo (look único a propósito, en ambos temas). */
.stage { background: radial-gradient(1200px 500px at 50% -10%, #12424f 0%, #071318 55%) , #071318; border-radius: 18px; padding: 22px 20px 26px; color: #d7e6ea; }
.stage-head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.stage-head h1 { color: #fff; }
.stage-head .sub { color: #8fb0b9; }
.stage-kpis { display: flex; flex-wrap: wrap; gap: 8px; }
.stage-kpi { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); border-radius: 10px; padding: 6px 12px; font-size: 12.5px; color: #9fbac2; }
.stage-kpi b { color: #fff; font-family: var(--font-display); font-size: 16px; margin-right: 4px; }
.farm { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; }
.unit { display: flex; flex-direction: column; align-items: center; gap: 10px; background: none; border: 0; padding: 8px 4px 10px; border-radius: 16px; color: inherit; cursor: pointer; font: inherit; }
.unit:hover { background: rgba(255,255,255,0.04); }
.unit.sel { background: rgba(34,184,214,0.12); outline: 1px solid rgba(34,184,214,0.5); }
.phone { width: 100%; max-width: 190px; aspect-ratio: 9 / 19; border-radius: 30px; background: #02080a; padding: 7px; box-shadow: 0 0 0 1.5px #2a3e45, 0 18px 40px rgba(0,0,0,0.55); position: relative; }
.phone.big { max-width: 270px; border-radius: 40px; padding: 9px; }
.scr { position: relative; width: 100%; height: 100%; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; font-size: 9.5px; color: #fff; }
.phone.big .scr { border-radius: 32px; font-size: 12.5px; }
.scr .sb { display: flex; justify-content: space-between; padding: 7px 12px 4px; font-size: 0.85em; font-weight: 600; opacity: 0.92; }
.scr .cam { position: absolute; top: 7px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #000; box-shadow: 0 0 0 1.5px #1c2a2f; }
.scr .navb { margin-top: auto; display: flex; justify-content: center; padding: 6px 0 8px; }
.scr .navb i { width: 34%; height: 3.5px; border-radius: 3px; background: rgba(255,255,255,0.7); }
.home { background: linear-gradient(165deg, #0e7490 0%, #1d4f63 45%, #13232b 100%); }
.home .clock { text-align: center; font-family: var(--font-display); font-size: 3.1em; font-weight: 500; margin-top: 10%; letter-spacing: -0.02em; }
.home .date { text-align: center; opacity: 0.8; }
.widget { margin: 10% 9% 0; background: rgba(255,255,255,0.14); border-radius: 12px; padding: 7px 9px; display: grid; gap: 2px; }
.widget small { opacity: 0.75; }
.grid-apps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 6px; padding: 0 8%; margin-top: auto; margin-bottom: 8%; }
.app-ic { display: grid; justify-items: center; gap: 3px; font-size: 0.72em; opacity: 0.95; min-width: 0; }
.app-ic em { font-style: normal; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-ic span { width: 100%; aspect-ratio: 1; border-radius: 28%; display: grid; place-items: center; font-weight: 700; font-size: 1.15em; }
.call { background: linear-gradient(180deg, #0b2a33, #06151a); text-align: center; }
.call .who { margin-top: 18%; font-family: var(--font-display); font-size: 1.9em; }
.call .ava { width: 34%; aspect-ratio: 1; border-radius: 50%; margin: 10% auto 6%; background: #22b8d6; display: grid; place-items: center; font-family: var(--font-display); font-size: 2.2em; color: #04212a; }
.call .tm { font-family: var(--font-mono); opacity: 0.85; }
.call .keys { display: flex; justify-content: center; gap: 12%; margin-top: auto; margin-bottom: 10%; }
.call .keys b { width: 22%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,0.12); display: grid; place-items: center; font-weight: 500; font-size: 0.8em; }
.call .keys b.end { background: #e5484d; }
.mail { background: #f4f8f9; color: #10232a; }
.mail .bar2 { background: #0e7490; color: #fff; padding: 8px 10px; font-weight: 600; }
.mail .row { padding: 6px 10px; border-bottom: 1px solid #dbe5e8; display: grid; gap: 1px; }
.mail .row small { color: #5b6f76; }
.mail .row.unread b::before { content: "● "; color: #0e7490; }
.qa { background: #fbf7ef; color: #2a1f10; }
.qa .bar2 { background: #b45309; color: #fff; padding: 8px 10px; font-weight: 600; }
.qa .frm { padding: 10px; display: grid; gap: 7px; }
.qa .fld { background: #fff; border: 1px solid #e7dcc6; border-radius: 6px; padding: 5px 7px; color: #6d5a3d; }
.qa .btnq { background: #b45309; color: #fff; text-align: center; border-radius: 6px; padding: 6px; font-weight: 600; }
.qa .tst { margin: auto 10px 10px; background: #10232a; color: #9fe6b6; border-radius: 6px; padding: 6px 7px; font-family: var(--font-mono); font-size: 0.85em; }
.boot { background: #000; align-items: center; justify-content: center; gap: 12px; }
.boot .logo2 { font-family: var(--font-mono); letter-spacing: 0.18em; color: #c8f5d7; font-size: 1.3em; }
.boot .prog { width: 46%; height: 3px; border-radius: 2px; background: #1f2b2f; overflow: hidden; }
.boot .prog span { display: block; width: 64%; height: 100%; background: #3ddc84; }
@media (prefers-reduced-motion: no-preference) { .boot .prog span { animation: load 2.4s ease-in-out infinite alternate; } }
@keyframes load { from { width: 18%; } to { width: 92%; } }
.cap { text-align: center; display: grid; gap: 3px; }
.cap .nm { color: #fff; font-weight: 600; font-size: 13px; }
.cap .id { font-family: var(--font-mono); font-size: 11.5px; color: #8fb0b9; }
.cap .mini { font-size: 11.5px; color: #8fb0b9; }
.console { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 26px; margin-top: 22px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; }
.ctl-col { display: flex; gap: 12px; align-items: flex-start; }
.tools { display: grid; gap: 8px; }
.tools button { width: 112px; text-align: left; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #d7e6ea; }
.tools button:hover { border-color: #22b8d6; color: #fff; }
.cinfo { min-width: 0; }
.cinfo h2 { color: #fff; margin-top: 4px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 6px 0 16px; }
.fact { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 8px 10px; font-size: 12px; color: #8fb0b9; }
.fact b { display: block; color: #fff; font-family: var(--font-mono); font-weight: 500; font-size: 12.5px; margin-top: 2px; }
.log { font-family: var(--font-mono); font-size: 12px; background: #030a0d; border-radius: 10px; padding: 10px 12px; color: #9fbac2; display: grid; gap: 4px; overflow-x: auto; }
.log span { color: #3ddc84; }
.stage .actions button { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); color: #e3eef1; }
.stage .actions button.primary { background: #0e7490; border-color: #0e7490; }
@media (max-width: 1100px) { .farm { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 700px) { .farm { grid-template-columns: repeat(2, minmax(0, 1fr)); } .console { grid-template-columns: 1fr; } .ctl-col { flex-direction: column; align-items: center; } .tools { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<div class="app">

    <div class="logo-row">
      <div class="logo">CAPTIA <span>Control</span></div>

  <main>

    <div class="topbar">
      <div class="chips">

</div>

<script>
// ---------------------------------------------------------------------------------------------

const vphones = [

  const g = v.group !== lastGroup ? `<div class="nav-group">${v.group}</div>` : "";
  lastGroup = v.group;
  return `${g}<a href="#${key}" data-key="${key}"><span>${v.label}</span>${v.count ? `<span class="count">${v.count()}</span>` : ""}</a>`;
}).join("");

function show() {
  const key = (location.hash || "#granja").slice(1);
  const view = allViews[key] || allViews.granja;
  document.getElementById("view").innerHTML = view.render();
  for (const a of nav.querySelectorAll("a")) a.classList.toggle("active", a.dataset.key === (allViews[key] ? key : "granja"));
  document.title = `${view.label} · CAPTIA Control · Prototipo`;
  document.getElementById("side").classList.remove("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded", "false");
}
window.addEventListener("hashchange", () => { show(); window.scrollTo(0, 0); });
show();

let toastTimer;
document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const t = document.getElementById("toast");
  t.textContent = `«${b.dataset.act}»: en el prototipo los botones no ejecutan acciones. En el producto real se crearía un trabajo y su estado aparecería aquí.`;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), 4200);
});
document.getElementById("menuBtn").addEventListener("click", (e) => {
  const side = document.getElementById("side");
  side.classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", String(side.classList.contains("open")));
});
</script>
</body>
</html>
